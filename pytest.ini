[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test_api_participantes
testpaths = tests talleres
python_files = test_*.py tests_*.py
pythonpath = .
markers =
    unitarios: reglas o componentes aislados, sin base de datos real.
    integracion: servicios, API y persistencia real en MongoDB de pruebas.
    e2e: navegador real, React, Django y MongoDB de pruebas.
