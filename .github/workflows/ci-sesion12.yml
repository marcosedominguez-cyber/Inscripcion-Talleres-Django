name: Sesion 12 - contrato del flujo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-flujo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener la version del repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Registrar entorno y version comprobada
        run: |
          python --version
          git rev-parse HEAD

      - name: Instalar dependencias declaradas
        run: python -m pip install -r requirements-ci.txt

      # Para paquetes src/ con pyproject.toml, agregar aqui su instalacion:
      # - run: python -m pip install -e .

      - name: Comprobar el contrato del flujo
        run: >-
          python -m pytest
          tests/test_reglas.py::test_inscribe_participante_y_confirma_la_plaza_disponible
          tests/test_reglas.py::test_rechaza_inscripcion_duplicada_sin_ocupar_otro_cupo
          tests/test_reglas.py::test_inscripcion_en_el_ultimo_cupo_deja_el_taller_sin_disponibilidad
          -q --junitxml=evidencias/sesion12-junit.xml

      - name: Conservar el resultado de las pruebas
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: resultados-sesion12-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidencias/sesion12-junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Preparar candidato de codigo fuente aprobado
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: git archive --format=zip --output="entrega-${GITHUB_SHA}.zip" HEAD

      - name: Conservar candidato para revision
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: candidato-sesion12-${{ github.sha }}
          path: entrega-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14

