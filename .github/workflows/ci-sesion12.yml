name: Integracion continua - pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-flujo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener la version del repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Registrar entorno y version comprobada
        run: |
          python --version
          git rev-parse HEAD

      - name: Instalar dependencias Python
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas backend
        run: |
          mkdir -p evidencias
          python -m pytest -q --junitxml=evidencias/backend-junit.xml

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Ejecutar pruebas del frontend
        working-directory: frontend
        run: npm test -- --reporter=junit --outputFile=../evidencias/frontend-junit.xml

      - name: Conservar el resultado de las pruebas
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidencias/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Preparar candidato de codigo fuente aprobado
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: git archive --format=zip --output="entrega-${GITHUB_SHA}.zip" HEAD

      - name: Conservar candidato para revision
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: candidato-codigo-${{ github.sha }}
          path: entrega-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14
