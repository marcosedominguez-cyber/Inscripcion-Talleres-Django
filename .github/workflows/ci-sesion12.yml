name: Integracion continua - pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-flujo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtener la version del repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Registrar entorno y version comprobada
        run: |
          python --version
          git rev-parse HEAD

      - name: Instalar dependencias Python
        run: python -m pip install -r requirements-ci.txt

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Preparar navegador real
        run: python -m playwright install --with-deps chromium

      - name: Preparar MongoDB local desechable
        run: |
          curl --fail --silent --show-error --location https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2404-8.0.17.tgz --output "$RUNNER_TEMP/mongodb.tgz"
          mkdir -p "$RUNNER_TEMP/mongodb"
          tar -xzf "$RUNNER_TEMP/mongodb.tgz" --strip-components=1 -C "$RUNNER_TEMP/mongodb"

      - name: Ejecutar y comprobar las 90 pruebas
        run: python scripts/ejecutar_pruebas.py --completa --mongod "$RUNNER_TEMP/mongodb/bin/mongod"

      - name: Conservar el resultado de las pruebas
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidencias/
          if-no-files-found: warn
          retention-days: 14

      - name: Preparar candidato de codigo fuente aprobado
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: git archive --format=zip --output="entrega-${GITHUB_SHA}.zip" HEAD

      - name: Conservar candidato para revision
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: candidato-codigo-${{ github.sha }}
          path: entrega-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14
